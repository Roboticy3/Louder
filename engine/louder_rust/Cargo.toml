[package]
name = "louder_rust"
version = "0.1.0"
edition = "2024"

[lib]
name = "louder_rust"
path = "src/lib.rs"
# The rlib is what `louder_godot` links against; the cdylib is what the C header
# in `tests/` is compiled and run against.
crate-type = ["cdylib", "rlib"]

[features]
# The shared machinery an adapter crate needs in order to declare Godot classes
# of its own, and nothing else. The engine registers no classes itself: it is
# reached from Godot, or from any other host, through the C boundary below, and
# `godot_api!` lives here only so that every adapter spells registration the
# same way.
#
# With the feature off, `godot` is not compiled at all, so the C header, the C++
# tests, and any host that does not care about Godot build against the engine
# alone. `louder_godot` turns it on because it is the crate that registers
# classes.
default = []
godot-bindings = ["dep:godot"]

[dependencies]
bitflags = "2.13.2"
godot = { version = "0.5.5", optional = true }
serde_json = "1.0.151"
strum = "0.28.0"
strum_macros = "0.28.0"