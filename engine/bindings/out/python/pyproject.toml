[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "louder"
version = "0.1.0"
description = "Bindings for the Louder dialogue engine"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["louder*"]

[tool.setuptools.package-data]
louder = ["py.typed"]
